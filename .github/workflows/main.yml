name: Create module release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Download map snapshot
        run: |
          python - <<'PY'
          import json, shutil, urllib.request
          from pathlib import Path
          assets = Path('assets/map')
          snapshot = json.loads((assets / 'snapshot.json').read_text())
          target = assets / 'golarion.pmtiles'
          request = urllib.request.Request(snapshot['Source'] + target.name, headers={
              'User-Agent': 'PF2e-Golarion-Map/1.0 (https://github.com/Frost-Jack/pf2e-golarion-map)'
          })
          with urllib.request.urlopen(request, timeout=120) as response, target.open('wb') as output:
              shutil.copyfileobj(response, output)
          if target.stat().st_size != snapshot['PMTilesBytes']:
              raise RuntimeError('Map download is incomplete: unexpected file size')
          PY
      - name: Set release manifest
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('module.json')
          data = json.loads(path.read_text())
          tag = os.environ['RELEASE_TAG']
          base = 'https://github.com/' + os.environ['REPOSITORY']
          data.update(version=tag.removeprefix('v'), url=base,
                      manifest=base + '/releases/latest/download/module.json',
                      download=base + '/releases/download/' + tag + '/module.zip')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Create archive
        run: zip -r module.zip module.json README.md LICENSE templates scripts styles languages vendor assets
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: module.json,module.zip
          tag: ${{ env.RELEASE_TAG }}
          omitBodyDuringUpdate: true
