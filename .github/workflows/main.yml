name: Create module release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Download map snapshot
        run: python tools/download_map.py
      - name: Set release manifest
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('module.json')
          data = json.loads(path.read_text())
          tag = os.environ['RELEASE_TAG']
          base = 'https://github.com/' + os.environ['REPOSITORY']
          data.update(version=tag.removeprefix('v'), url=base,
                      manifest=base + '/releases/latest/download/module.json',
                      download=base + '/releases/download/' + tag + '/module.zip')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Create archive
        run: zip -r module.zip module.json README.md LICENSE templates scripts styles languages vendor assets
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: module.json,module.zip
          tag: ${{ env.RELEASE_TAG }}
          omitBodyDuringUpdate: true
